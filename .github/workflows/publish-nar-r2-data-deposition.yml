name: Publish NAR R2 data deposition

on:
  push:
    branches:
      - nar-r2-data-deposition
    paths:
      - .github/workflows/publish-nar-r2-data-deposition.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Update immutable tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: fec29ff75c8d51ed3186a1a00dfc4b0cd47da59f
        run: |
          if gh release view nar-r2-data-deposition --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit nar-r2-data-deposition \
              --repo "${{ github.repository }}" \
              --title "HURDLER construct designs and sequencing results" \
              --notes "Versioned HURDLER data deposition containing repeat-protein fragment designs, assembled plasmid constructs, Nanopore sequencing outputs, a deterministic Supplementary Information file tree, and validation records."
          else
            gh release create nar-r2-data-deposition \
              --repo "${{ github.repository }}" \
              --target "$TARGET_SHA" \
              --title "HURDLER construct designs and sequencing results" \
              --notes "Versioned HURDLER data deposition containing repeat-protein fragment designs, assembled plasmid constructs, Nanopore sequencing outputs, a deterministic Supplementary Information file tree, and validation records."
          fi
