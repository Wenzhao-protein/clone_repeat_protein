[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hurdler"
version = "0.6.0"
description = "Reproducible HURDLER repeat-protein cloning analyses"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "biotite>=1.0",
  "biopython>=1.83",
  "duckdb>=1.1",
  "h5py>=3.10",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.1",
  "pillow>=10",
  "pyarrow>=15",
  "requests>=2.31",
  "scipy>=1.12",
  "seaborn>=0.13",
  "tqdm>=4.66",
]

[project.optional-dependencies]
notebooks = [
  "dna-features-viewer>=3.1.5,<4",
  "ipykernel>=6.29",
  "ipywidgets>=8.1",
  "jupyterlab>=4.1",
  "kaleido==0.2.1",
  "marimo>=0.13",
  "nbclient>=0.10",
  "nbconvert>=7.16",
  "notebook>=7.1",
  "papermill>=2.6",
  "plotly>=5.20",
]
optimization = ["dnachisel>=3.2", "scikit-opt>=0.6.6"]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
hurdler = "hurdler.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
